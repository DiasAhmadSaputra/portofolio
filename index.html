*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:6rem}
body{font:400 1rem/1.65 var(--f);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60rem 30rem at 85% -5%,rgba(47,143,84,.35),transparent 70%),radial-gradient(40rem 24rem at 0 30%,rgba(183,230,90,.07),transparent 70%),linear-gradient(var(--line) 1px,transparent 1px) 0 0/72px 72px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/72px 72px;-webkit-mask-image:linear-gradient(#000 40%,transparent);mask-image:linear-gradient(#000 40%,transparent)}
a{color:inherit}
:focus-visible{outline:3px solid var(--lime);outline-offset:3px;border-radius:8px}
.wrap{max-width:1080px;margin:0 auto;padding:0 1.4rem}

.nav{position:fixed;top:1rem;left:50%;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:.25rem;padding:.35rem;border-radius:999px;background:rgba(15,31,23,.85);backdrop-filter:blur(12px);border:1px solid var(--line);max-width:calc(100vw - 1rem)}
.nav a{text-decoration:none;font-weight:600;font-size:.88rem;padding:.4rem .85rem;border-radius:999px;color:var(--muted);transition:background .2s,color .2s;white-space:nowrap}
.nav a:hover{color:var(--ink)}
.nav a.on{background:var(--lime);color:#10200a}
.mark{font-weight:800;color:var(--lime);padding:.4rem .8rem}
.lang{display:flex;margin-left:.3rem;border:1px solid var(--line);border-radius:999px;padding:2px}
.lang button{font:700 .78rem var(--f);border:0;background:transparent;color:var(--muted);padding:.3rem .65rem;border-radius:999px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}

.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.7rem 1.25rem;border-radius:12px;font:700 .95rem var(--f);text-decoration:none;border:2px solid var(--ink);color:var(--ink);cursor:pointer;background:transparent;transition:transform .2s,box-shadow .2s}
.btn.fill{background:var(--lime);border-color:var(--lime);color:#10200a}
.btn:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--coral)}

.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:3.5rem;align-items:center;padding:8rem 0 2.5rem}
.pill{display:inline-flex;align-items:center;gap:.55rem;padding:.35rem .9rem;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-weight:600;font-size:.85rem;color:var(--muted);margin-bottom:1.3rem}
.pill i{width:.55rem;height:.55rem;border-radius:50%;background:var(--lime);box-shadow:0 0 0 4px rgba(183,230,90,.2)}
h1{font:800 clamp(2.1rem,5vw,3.5rem)/1.08 var(--f);letter-spacing:-.03em}
h1 em{font-style:normal;display:block;margin-top:.7rem;font-size:clamp(1rem,2vw,1.25rem);font-weight:600;letter-spacing:0;color:var(--lime);line-height:1.4}
.hero p{max-width:33rem;color:var(--muted);margin:1.2rem 0 1.8rem}
.btns{display:flex;gap:.9rem;flex-wrap:wrap}
.photo{position:relative;justify-self:center;width:min(320px,78vw)}
.frame{position:relative;aspect-ratio:4/5;border-radius:22px;overflow:hidden;border:2px solid var(--ink);background:var(--panel2);display:grid;place-items:center;font:800 5rem var(--f);color:var(--lime)}
.frame img{width:100%;height:100%;object-fit:cover}
.frame::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--lime);box-shadow:0 0 24px 6px rgba(183,230,90,.55);animation:scan 2.2s ease-in-out .4s 1 both}
@keyframes scan{0%{top:0;opacity:1}90%{opacity:1}100%{top:100%;opacity:0}}
.corners{--g:linear-gradient(var(--lime),var(--lime));position:absolute;inset:-12px;pointer-events:none;background:var(--g) 0 0/30px 3px,var(--g) 0 0/3px 30px,var(--g) 100% 0/30px 3px,var(--g) 100% 0/3px 30px,var(--g) 0 100%/30px 3px,var(--g) 0 100%/3px 30px,var(--g) 100% 100%/30px 3px,var(--g) 100% 100%/3px 30px;background-repeat:no-repeat}
.chip-r{position:absolute;left:50%;bottom:-1.1rem;transform:translateX(-50%);white-space:nowrap;z-index:2;padding:.5rem 1rem;border-radius:999px;background:var(--lime);color:#10200a;font-weight:800;font-size:.85rem;box-shadow:0 12px 28px -10px #000;animation:pop .5s ease-out 2.5s both}
@keyframes pop{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:20px;background:var(--panel);margin-top:2.5rem}
.stats div{padding:1.2rem 1.3rem;border-left:1px solid var(--line)}
.stats div:first-child{border-left:0}
.stats b{display:block;font:800 1.9rem/1.1 var(--f);color:var(--lime)}
.stats span{color:var(--muted);font-size:.88rem}

section{padding:3.5rem 0}
.head{display:flex;align-items:center;gap:1.2rem;margin-bottom:1.8rem}
.head h2{font:800 clamp(1.5rem,3vw,2.1rem) var(--f);letter-spacing:-.02em}
.head::after{content:"";height:2px;flex:1;background:linear-gradient(90deg,var(--leaf),transparent)}

.bento{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:1.5rem}
.tile h3{font:700 1rem var(--f);color:var(--lime);margin-bottom:.8rem}
.tile p{color:var(--muted)}
.t-bio,.t-do{grid-column:span 2}
.t-bio p{color:var(--ink)}
.t-sk{grid-column:span 4}
.t-do ul{list-style:none;padding:0;display:grid;gap:.6rem}
.t-do li,.item li{display:flex;gap:.7rem}
.t-do li::before,.item li::before{content:"";width:.5rem;height:.5rem;margin-top:.6rem;border-radius:2px;background:var(--coral);flex:none;transform:rotate(45deg)}
.sg{display:grid;grid-template-columns:repeat(5,1fr);gap:1.2rem}
.sg h4{font:700 .85rem var(--f);color:var(--muted);margin-bottom:.55rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chips span{padding:.25rem .7rem;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-weight:600;font-size:.82rem}

.row{display:grid;grid-template-columns:.9fr 1.1fr;gap:2.5rem;align-items:center;padding:2rem 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0;padding-top:0}
.row.flip .info{order:2}
.row h3{font:800 1.6rem var(--f);letter-spacing:-.01em}
.tech{display:flex;flex-wrap:wrap;gap:.45rem;margin:.9rem 0 1.1rem}
.tech span{font-weight:700;font-size:.78rem;padding:.2rem .6rem;border-radius:8px;background:var(--panel2);color:var(--lime);border:1px solid var(--line)}
.row p{color:var(--muted);max-width:32rem}
.row .btns{margin-top:1.5rem}
.win{border-radius:14px;overflow:hidden;border:2px solid var(--ink);background:var(--panel);box-shadow:8px 8px 0 var(--c,var(--lime));transition:transform .25s,box-shadow .25s}
.row:hover .win{transform:translate(-3px,-3px);box-shadow:11px 11px 0 var(--c,var(--lime))}
.bar{display:flex;gap:.4rem;padding:.65rem .8rem;border-bottom:2px solid var(--ink);background:var(--panel2)}
.bar i{width:.65rem;height:.65rem;border-radius:50%;background:var(--coral)}
.bar i:nth-child(2){background:var(--lime)}
.bar i:nth-child(3){background:#6fd6ff}
.scr{aspect-ratio:16/10;background:#fff}
.scr img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.ph{width:100%;height:100%;display:grid;place-items:center;text-align:center;padding:1rem;font-weight:700;color:var(--muted);background:repeating-linear-gradient(45deg,var(--panel),var(--panel) 12px,var(--panel2) 12px,var(--panel2) 24px)}

.tl{display:grid;grid-template-columns:1.2fr .8fr;gap:1rem}
.item+.item{margin-top:1.2rem;padding-top:1.2rem;border-top:1px solid var(--line)}
.item h4{font:800 1.1rem var(--f)}
.sub{color:var(--muted);font-size:.92rem}
.date{display:inline-block;margin:.5rem 0;font-weight:700;font-size:.78rem;padding:.2rem .6rem;border-radius:8px;background:var(--panel2);color:var(--lime);border:1px solid var(--line)}
.item ul{list-style:none;padding:0;display:grid;gap:.4rem;margin-top:.4rem;color:var(--muted)}

.cta{background:linear-gradient(135deg,var(--lime),#8fd16a);color:#10200a;border-radius:26px;padding:2.6rem 2.2rem}
.cta h2{font:800 clamp(1.6rem,3.4vw,2.5rem)/1.15 var(--f);letter-spacing:-.025em;max-width:40rem}
.mail{display:inline-block;margin-top:1.5rem;font:800 clamp(1.1rem,2.4vw,1.5rem) var(--f);text-decoration:none;border-bottom:3px solid #10200a;word-break:break-all}
.mail:hover{border-color:var(--coral)}
.loc{margin-top:1rem;font-weight:600}
.soc{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1.4rem}
.soc a{padding:.4rem 1rem;font-size:.9rem;border:2px solid #10200a;border-radius:999px;font-weight:700;text-decoration:none;transition:background .2s,color .2s}
.soc a:hover{background:#10200a;color:var(--lime)}
form{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.2rem;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:1.5rem}
label{display:block;font-weight:700;margin-bottom:.35rem;font-size:.88rem}
input,textarea{width:100%;padding:.7rem .95rem;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 .95rem var(--f)}
textarea{min-height:130px;resize:vertical}
.full{grid-column:1/-1}
footer{padding:2.5rem 0 3rem;text-align:center;color:var(--muted);font-size:.92rem}

@media (max-width:880px){
  .hero,.row,.tl{grid-template-columns:1fr}
  .hero{padding-top:6.5rem;gap:2.8rem}
  .row.flip .info{order:0}
  .bento{grid-template-columns:1fr}
  .t-bio,.t-do,.t-sk{grid-column:auto}
  .sg{grid-template-columns:1fr 1fr}
  .stats{grid-template-columns:1fr 1fr}
  .stats div:nth-child(3){border-left:0}
  .stats div:nth-child(n+3){border-top:1px solid var(--line)}
  form{grid-template-columns:1fr}
}
@media (max-width:560px){.nav a{padding:.4rem .5rem;font-size:.8rem}.mark{display:none}.sg{grid-template-columns:1fr}.cta{padding:2.2rem 1.4rem}}
@media (prefers-reduced-motion:reduce){*,::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

    var info = el('div', 'info'); info.appendChild(el('h3', '', p.title));
    var t = el('div', 'tech'); p.tech.forEach(function(x){ t.appendChild(el('span', '', x)); });
    info.appendChild(t); info.appendChild(el('p', '', L(p.desc)));
    var b = el('div', 'btns');
    p.links.forEach(function(l, k){ var a = el('a', 'btn' + (k ? '' : ' fill'), l[0] + ' ↗'); if (l[0] === 'Live site' && lang === 'id') a.textContent = 'Situs live ↗'; a.href = l[1]; a.target = '_blank'; a.rel = 'noopener'; b.appendChild(a); });
    info.appendChild(b);
    var w = el('div', 'win'), bar = el('div', 'bar'); bar.innerHTML = '<i></i><i></i><i></i>';
    var scr = el('div', 'scr'), pic = new Image(); pic.alt = p.title; pic.loading = 'lazy'; pic.src = p.img;
    pic.onerror = function(){ pic.replaceWith(el('div', 'ph', p.img)); };
    scr.appendChild(pic); w.appendChild(bar); w.appendChild(scr); r.appendChild(info); r.appendChild(w); return r;
  });
  fill('expl', DATA.experience, function(x){ var d = el('div', 'item'); d.appendChild(el('h4', '', x.title)); d.appendChild(el('div', 'sub', x.org)); d.appendChild(el('span', 'date', L(x.date))); var u = el('ul'); x.points.forEach(function(p){ u.appendChild(el('li', '', L(p))); }); d.appendChild(u); return d; });
  fill('edul', DATA.education, function(x){ var d = el('div', 'item'); d.appendChild(el('h4', '', x.title)); d.appendChild(el('div', 'sub', L(x.sub))); return d; });
  $('loc').textContent = '📍 ' + L(DATA.location);
  $('cv').href = DATA.cv;
  $('mail').href = 'mailto:' + DATA.email; $('mail').textContent = DATA.email;
  fill('soc', DATA.social, function(s){ var a = el('a', '', s[0]); a.href = s[1]; a.target = '_blank'; a.rel = 'noopener'; return a; });
  document.title = 'Dias Ahmad Saputra | ' + (lang === 'id' ? 'Portofolio' : 'Portfolio');
}
document.querySelectorAll('.lang button').forEach(function(b){
  b.addEventListener('click', function(){ lang = b.dataset.l; try{ localStorage.setItem('lang', lang); }catch(e){} render(); });
});
$('yr').textContent = new Date().getFullYear();
var im = new Image(); im.alt = 'Dias Ahmad Saputra'; im.src = DATA.photo;
im.onload = function(){ $('frame').appendChild(im); }; im.onerror = function(){ $('frame').textContent = 'D'; };
$('form').addEventListener('submit', function(e){
  e.preventDefault();
  var body = $('m').value + '\n\n— ' + $('n').value + ' (' + $('e').value + ')';
  location.href = 'mailto:' + DATA.email + '?subject=' + encodeURIComponent(L(UI.subj) + $('n').value) + '&body=' + encodeURIComponent(body);
});
render();

var io = new IntersectionObserver(function(es){
  es.forEach(function(x){ if (x.isIntersecting) document.querySelectorAll('#menu a').forEach(function(a){ a.classList.toggle('on', a.dataset.h === '#' + x.target.id); }); });
}, {rootMargin:'-45% 0px -50% 0px'});
document.querySelectorAll('section[id]').forEach(function(s){ io.observe(s); });
</script>
</body>
</html>
