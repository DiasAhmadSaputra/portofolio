<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dias Ahmad Saputra | Portfolio</title>
<meta name="description" content="Portfolio of an Informatics student building web apps and AI image classification.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a130f;--panel:#11201a;--panel2:#16291f;--line:#244034;--ink:#eef6ee;--muted:#9bb2a4;--lime:#d3f45b;--coral:#ff7b5c;--head:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;--body:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:6rem}
body{font:400 1rem/1.65 var(--body);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:72px 72px;opacity:.28;-webkit-mask-image:radial-gradient(ellipse at 50% 0,#000,transparent 75%);mask-image:radial-gradient(ellipse at 50% 0,#000,transparent 75%)}
a{color:inherit}
:focus-visible{outline:3px solid var(--lime);outline-offset:3px;border-radius:8px}
.wrap{max-width:1040px;margin:0 auto;padding:0 1.4rem}

/* Floating pill nav */
.nav{position:fixed;top:1rem;left:50%;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:.3rem;padding:.4rem;border-radius:999px;background:rgba(17,32,26,.82);backdrop-filter:blur(12px);border:1px solid var(--line)}
.nav a{text-decoration:none;font-weight:600;font-size:.9rem;padding:.4rem .95rem;border-radius:999px;color:var(--muted);transition:background .2s,color .2s}
.nav a:hover{color:var(--ink)}
.nav a.on{background:var(--lime);color:#10200a}
.nav .mark{font:800 1.1rem var(--head);color:var(--lime);padding:.4rem .9rem}

.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.7rem 1.2rem;border-radius:12px;font:700 .95rem var(--body);text-decoration:none;border:2px solid var(--ink);color:var(--ink);cursor:pointer;background:transparent;transition:transform .2s,box-shadow .2s}
.btn.fill{background:var(--lime);border-color:var(--lime);color:#10200a}
.btn:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--coral)}

/* Hero */
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:3rem;align-items:center;padding:7.5rem 0 3.5rem}
.pill{display:inline-flex;align-items:center;gap:.55rem;padding:.35rem .9rem;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-weight:600;font-size:.85rem;color:var(--muted);margin-bottom:1.2rem}
.pill i{width:.55rem;height:.55rem;border-radius:50%;background:var(--lime);box-shadow:0 0 0 4px rgba(211,244,91,.2)}
h1{font:800 clamp(1.9rem,4.2vw,3rem)/1.15 var(--head);letter-spacing:-.025em}
h1 em{font-style:normal;color:var(--muted);display:block}
.hero p{max-width:32rem;color:var(--muted);margin:1.1rem 0 1.7rem;font-size:1rem}
.btns{display:flex;gap:.9rem;flex-wrap:wrap}
.photo{position:relative;justify-self:center;width:min(310px,78vw)}
.photo::before{content:"";position:absolute;inset:0;border-radius:28px;background:var(--lime);transform:translate(12px,12px) rotate(3deg)}
.frame{position:relative;aspect-ratio:4/5;border-radius:28px;overflow:hidden;border:2px solid var(--ink);background:var(--panel2);transform:rotate(-3deg);display:grid;place-items:center;font:800 5rem var(--head);color:var(--lime)}
.frame img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;z-index:2;padding:.4rem .9rem;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:.8rem;box-shadow:0 10px 24px -10px #000}
.tag.a{left:-1.5rem;top:2.2rem;color:var(--lime)}
.tag.b{right:-1rem;bottom:3.2rem;color:var(--coral)}

/* Section head */
section{padding:3.5rem 0}
.head{display:flex;align-items:center;gap:1.2rem;margin-bottom:1.8rem}
.head h2{font:800 clamp(1.5rem,3vw,2rem) var(--head);letter-spacing:-.02em;white-space:nowrap}
.head::after{content:"";height:2px;flex:1;background:var(--line)}

/* Bento */
.bento{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:1.4rem}
.tile h3{font:700 .95rem var(--head);color:var(--lime);margin-bottom:.7rem}
.tile p{color:var(--muted)}
.t-bio{grid-column:span 2;grid-row:span 2}
.t-bio p{font-size:1.02rem;color:var(--ink)}
.t-skills{grid-column:span 2}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chips span{padding:.3rem .8rem;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-weight:600;font-size:.85rem}
.t-do{grid-column:span 2}
.t-do ul{list-style:none;padding:0;display:grid;gap:.5rem}
.t-do li{display:flex;gap:.7rem}
.t-do li::before{content:"";width:.6rem;height:.6rem;margin-top:.55rem;border-radius:2px;background:var(--coral);flex:none;transform:rotate(45deg)}

/* Projects */
.row{display:grid;grid-template-columns:.9fr 1.1fr;gap:2rem;align-items:center;padding:1.8rem 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0;padding-top:0}
.row.flip .info{order:2}
.row h3{font:800 1.5rem var(--head);letter-spacing:-.01em}
.row .tech{display:flex;flex-wrap:wrap;gap:.45rem;margin:.9rem 0 1.1rem}
.row .tech span{font-weight:700;font-size:.78rem;padding:.2rem .6rem;border-radius:8px;background:var(--panel2);color:var(--lime);border:1px solid var(--line)}
.row p{color:var(--muted);max-width:30rem}
.row .btns{margin-top:1.5rem}
.win{border-radius:14px;overflow:hidden;border:2px solid var(--ink);background:var(--panel);box-shadow:8px 8px 0 var(--c,var(--lime));transition:transform .25s,box-shadow .25s}
.row:hover .win{transform:translate(-3px,-3px);box-shadow:11px 11px 0 var(--c,var(--lime))}
.win .bar{display:flex;gap:.4rem;padding:.65rem .8rem;border-bottom:2px solid var(--ink);background:var(--panel2)}
.win .bar i{width:.65rem;height:.65rem;border-radius:50%;background:var(--coral)}
.win .bar i:nth-child(2){background:var(--lime)}
.win .bar i:nth-child(3){background:#6fd6ff}
.win .scr{aspect-ratio:16/10;background:#fff}
.win .scr img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.ph{width:100%;height:100%;display:grid;place-items:center;text-align:center;padding:1rem;font-weight:700;color:var(--muted);background:repeating-linear-gradient(45deg,var(--panel),var(--panel) 12px,var(--panel2) 12px,var(--panel2) 24px)}

/* Contact */
.cta{background:var(--lime);color:#10200a;border-radius:26px;padding:2.4rem 2rem}
.cta h2{font:800 clamp(1.6rem,3.4vw,2.4rem)/1.15 var(--head);letter-spacing:-.025em;max-width:40rem}
.mail{display:inline-block;margin-top:1.5rem;font:800 clamp(1.1rem,2.4vw,1.5rem) var(--head);text-decoration:none;border-bottom:3px solid #10200a;word-break:break-all}
.mail:hover{border-color:var(--coral)}
.soc{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1.8rem}
.soc a{padding:.4rem 1rem;font-size:.9rem;border:2px solid #10200a;border-radius:999px;font-weight:700;text-decoration:none;transition:background .2s,color .2s}
.soc a:hover{background:#10200a;color:var(--lime)}
form{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.2rem;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:1.4rem}
form label{display:block;font-weight:700;margin-bottom:.35rem;font-size:.88rem}
form input,form textarea{width:100%;padding:.7rem .95rem;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 .95rem var(--body)}
form textarea{min-height:130px;resize:vertical}
form .full{grid-column:1/-1}
footer{padding:2.5rem 0 3rem;text-align:center;color:var(--muted);font-size:.92rem}

@media (max-width:880px){
  .hero,.row{grid-template-columns:1fr}
  .hero{padding-top:6rem;gap:2.2rem}
  .row.flip .info{order:0}
  .bento{grid-template-columns:1fr 1fr}
  .t-bio,.t-skills,.t-do{grid-column:span 2}
  .t-bio{grid-row:auto}
  form{grid-template-columns:1fr}
  .tag.a{left:0}.tag.b{right:0}
}
@media (max-width:520px){.nav a{padding:.45rem .7rem;font-size:.88rem}.nav .mark{display:none}.cta{padding:2.2rem 1.4rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<nav class="nav" id="menu" aria-label="Main navigation"><span class="mark" id="mark">Y.</span></nav>

<main class="wrap">
  <section class="hero" id="home">
    <div>
      <div class="pill"><i></i><span id="status"></span></div>
      <h1><span id="hi"></span><em id="role"></em></h1>
      <p id="intro"></p>
      <div class="btns">
        <a class="btn fill" href="#projects">See my work ↓</a>
        <a class="btn" href="resume.pdf">Download CV</a>
      </div>
    </div>
    <div class="photo">
      <span class="tag a">Flask</span><span class="tag b">TensorFlow</span>
      <div class="frame" id="frame"></div>
    </div>
  </section>

  <section id="about">
    <div class="head"><h2>About</h2></div>
    <div class="bento">
      <div class="tile t-bio"><h3>Hello</h3><p id="about-text"></p></div>
      <div class="tile t-skills"><h3>Toolbox</h3><div class="chips" id="chips"></div></div>
      <div class="tile t-do"><h3>What I do</h3><ul id="does"></ul></div>
    </div>
  </section>

  <section id="projects">
    <div class="head"><h2>Projects</h2></div>
    <div id="rows"></div>
  </section>

  <section id="contact">
    <div class="cta">
      <h2>Got an idea? Let's build it together.</h2>
      <a class="mail" id="mail"></a>
      <div class="soc" id="soc"></div>
    </div>
    <form id="form">
      <div><label for="n">Name</label><input id="n" placeholder="Your name" required></div>
      <div><label for="e">Email</label><input id="e" type="email" placeholder="you@example.com" required></div>
      <div class="full"><label for="m">Message</label><textarea id="m" placeholder="Tell me about your project" required></textarea></div>
      <div class="full"><button class="btn fill" type="submit">Send message →</button></div>
    </form>
  </section>
</main>
<footer>© <span id="yr"></span> <span id="fname"></span></footer>

<script>
/* ===== EDIT YOUR CONTENT HERE ===== */
var DATA = {
  name: 'Dias Ahmad Saputra',
  status: 'Open to internships and collaboration',
  role: 'Informatics student building web apps and AI.',
  intro: 'I turn messy problems into clean apps with Flask and image-classification models, from raw data to something people can use.',
  photo: 'images/profile.jpg',
  about: 'I study Informatics at Universitas Bhayangkara Jakarta Raya. I like taking a project from the first database table to a live deployment, so other people can actually try it. Replace this with a short story about yourself.',
  skills: ['Python','Flask','PHP','MySQL','TensorFlow','Keras','JavaScript','HTML','CSS','Git','Vercel'],
  does: ['Web apps with Flask, PHP, and MySQL', 'Image classification with MobileNetV2', 'Auth, payments, and push notifications'],
  projects: [
    { title:'PilahNexa AI', c:'#d3f45b', tech:['Python','TensorFlow','MobileNetV2','Flask'],
      desc:'Recognizes waste types from a photo, then explains how to sort and recycle them. Includes a chat agent, scan history, and Google login.',
      img:'images/pilahnexa-desktop.jpg', url:'pilahnexa.app',
      links:[['GitHub','https://github.com/DiasAhmadSaputra']] },
    { title:'SmartLaundry', c:'#ff7b5c', tech:['Flask','MySQL','Web Push','Vercel'],
      desc:'Laundry management for admins, drivers, and customers, with simulated QRIS payment and public order tracking.',
      img:'images/smartlaundry-desktop.jpg', url:'smart-laundry-dz.vercel.app',
      links:[['Live site','https://smart-laundry-dz.vercel.app'],['GitHub','https://github.com/DiasAhmadSaputra/SmartLaundry']] }
  ],
  email: 'youremail@example.com',
  social: [['GitHub','https://github.com/DiasAhmadSaputra'],['LinkedIn','https://www.linkedin.com/in/your-username'],['Instagram','https://www.instagram.com/your_instagram']]
};
/* ===== END OF CONTENT ===== */

var $ = function(id){ return document.getElementById(id); };
function el(t, c, h){ var e = document.createElement(t); if (c) e.className = c; if (h != null) e.textContent = h; return e; }

document.title = DATA.name + ' | Portfolio';
$('mark').textContent = DATA.name.charAt(0) + '.';
$('status').textContent = DATA.status;
$('hi').textContent = "Hi, I’m " + DATA.name + ".";
$('role').textContent = DATA.role; $('intro').textContent = DATA.intro;
$('about-text').textContent = DATA.about;
$('fname').textContent = DATA.name; $('yr').textContent = new Date().getFullYear();

// Nav
[['Home','#home'],['About','#about'],['Projects','#projects'],['Contact','#contact']].forEach(function(m, i){
  var a = el('a', i === 0 ? 'on' : '', m[0]); a.href = m[1]; $('menu').appendChild(a);
});

// Photo with fallback initial
var im = new Image(); im.alt = DATA.name; im.src = DATA.photo;
im.onload = function(){ $('frame').appendChild(im); };
im.onerror = function(){ $('frame').textContent = DATA.name.charAt(0); };

DATA.skills.forEach(function(s){ $('chips').appendChild(el('span', '', s)); });
DATA.does.forEach(function(s){ $('does').appendChild(el('li', '', s)); });

// Projects
DATA.projects.forEach(function(p, i){
  var r = el('article', 'row' + (i % 2 ? ' flip' : '')); r.style.setProperty('--c', p.c);
  var info = el('div', 'info'); info.appendChild(el('h3', '', p.title));
  var t = el('div', 'tech'); p.tech.forEach(function(x){ t.appendChild(el('span', '', x)); });
  info.appendChild(t); info.appendChild(el('p', '', p.desc));
  var b = el('div', 'btns');
  p.links.forEach(function(l, k){ var a = el('a', 'btn' + (k === 0 ? ' fill' : ''), l[0] + ' ↗'); a.href = l[1]; a.target = '_blank'; a.rel = 'noopener'; b.appendChild(a); });
  info.appendChild(b);
  var w = el('div', 'win'); var bar = el('div', 'bar'); bar.innerHTML = '<i></i><i></i><i></i>';
  var scr = el('div', 'scr'), pic = new Image(); pic.alt = p.title + ' screenshot'; pic.loading = 'lazy'; pic.src = p.img;
  pic.onerror = function(){ pic.replaceWith(el('div', 'ph', 'Add screenshot: ' + p.img)); };
  scr.appendChild(pic); w.appendChild(bar); w.appendChild(scr);
  r.appendChild(info); r.appendChild(w); $('rows').appendChild(r);
});

// Contact
var mail = $('mail'); mail.href = 'mailto:' + DATA.email; mail.textContent = DATA.email;
DATA.social.forEach(function(s){ var a = el('a', '', s[0]); a.href = s[1]; a.target = '_blank'; a.rel = 'noopener'; $('soc').appendChild(a); });
$('form').addEventListener('submit', function(e){
  e.preventDefault();
  var body = $('m').value + '\n\n— ' + $('n').value + ' (' + $('e').value + ')';
  location.href = 'mailto:' + DATA.email + '?subject=' + encodeURIComponent('Portfolio message from ' + $('n').value) + '&body=' + encodeURIComponent(body);
});

// Active nav pill
var links = document.querySelectorAll('#menu a');
var io = new IntersectionObserver(function(es){
  es.forEach(function(x){ if (x.isIntersecting) links.forEach(function(a){ a.classList.toggle('on', a.getAttribute('href') === '#' + x.target.id); }); });
}, {rootMargin:'-45% 0px -50% 0px'});
document.querySelectorAll('section[id]').forEach(function(s){ io.observe(s); });
</script>
</body>
</html>
